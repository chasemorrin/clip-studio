# XcodeGen project definition. Generate the Xcode project with:
#   cd ios && xcodegen
# Then open ClipStudio.xcodeproj. Re-run `xcodegen` after pulling changes that add files.
name: ClipStudio
options:
  bundleIdPrefix: com.chasemorrin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Your Apple Team ID (Xcode > Settings > Accounts, or developer.apple.com > Membership).
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipStudio:
    type: application
    platform: iOS
    sources:
      - path: ClipStudio
        excludes:
          - "Info.plist"
          - "ClipStudio.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasemorrin.clipstudio
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: ClipStudio/Info.plist
      properties:
        CFBundleDisplayName: Clip Studio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        ServerURL: https://clip-studio.chasemorrin.workers.dev
        NSPhotoLibraryUsageDescription: Clip Studio opens the videos you choose so it can find clips in them.
        NSPhotoLibraryAddUsageDescription: Clip Studio saves the clips you make to your photo library.
        CFBundleURLTypes:
          - CFBundleURLName: com.chasemorrin.clipstudio
            CFBundleURLSchemes: [clipstudio]
    entitlements:
      path: ClipStudio/ClipStudio.entitlements
      properties:
        # Uncomment once you're in the Apple Developer Program (Sign in with Apple needs it):
        # com.apple.developer.applesignin: [Default]
        {}
